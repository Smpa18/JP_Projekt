# ============================================================
#  DATENBANK-VERBINDUNG
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/justiceproDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:JusticePro}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=public

# ============================================================
#  HIBERNATE / JPA
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================================
#  JWT (Login-Token)
# ============================================================
jwt.secret=${JWT_SECRET:BITTE_HIER_EINEN_LANGEN_ZUFAELLIGEN_GEHEIMTEXT_MIT_MIND_32_ZEICHEN}
jwt.expiration-ms=604800000

# ============================================================
#  DATEI-UPLOADS (Pièces jointes)
# ============================================================
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB

# ============================================================
#  JACKSON - Leere Strings für Enums als null behandeln
# ============================================================
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=false
spring.jackson.deserialization.ACCEPT_EMPTY_STRING_AS_NULL_OBJECT=true